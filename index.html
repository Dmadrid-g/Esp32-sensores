<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medio Ambiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #E8EDE4;
    --panel: #F7F9F4;
    --ink: #18231C;
    --muted: #5B6B61;
    --line: #CBD5C8;
    --ok: #2F7D4F;
    --bad: #B5432B;
    --grid: rgba(24, 35, 28, .09);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101713;
      --panel: #18211B;
      --ink: #E6EDE4;
      --muted: #94A599;
      --line: #2A372E;
      --ok: #5CC083;
      --bad: #E27A63;
      --grid: rgba(230, 237, 228, .09);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 16px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 20px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.05;
    letter-spacing: -.02em;
    margin: 0 0 4px;
  }
  .sub { color: var(--muted); margin: 0; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel); font-weight: 500; font-size: .95rem;
  }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status.on i { background: var(--ok); }
  .status.off i { background: var(--bad); }

  .range { display: flex; gap: 6px; margin: 0 0 16px; }
  .range button {
    font: inherit; font-size: .9rem; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .range button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 12px; }
  .panel h2 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--muted); }
  .value {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 700; font-size: clamp(2.6rem, 7vw, 3.8rem);
    line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .value small { font-size: .38em; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .minmax { color: var(--muted); font-size: .88rem; margin: 0 0 8px; min-height: 1.3em; }
  .chart { position: relative; height: 150px; }
  .empty { color: var(--muted); margin-top: 20px; display: none; }
  footer { color: var(--muted); font-size: .85rem; margin-top: 24px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Medio Ambiente</h1>
      <p class="sub">Sensores del ESP32-S3 en tiempo real</p>
    </div>
    <div id="status" class="status" role="status"><i></i><span id="statusText">Conectando…</span></div>
  </header>

  <div class="range" role="group" aria-label="Rango del historial">
    <button type="button" data-n="60" aria-pressed="true">Última hora</button>
    <button type="button" data-n="360" aria-pressed="false">6 horas</button>
    <button type="button" data-n="1440" aria-pressed="false">24 horas</button>
  </div>

  <section class="grid" id="grid"></section>
  <p class="empty" id="empty">Aún no hay datos. Enciende el ESP32 y espera unos 20 segundos.</p>
  <footer>Datos de Firebase Realtime Database. Se guarda un punto del historial cada minuto.</footer>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

// ---------- CONFIGURAMOA ESTO TMB ----------
const DATABASE_URL = "https://medio-ambiente-f3d50-default-rtdb.firebaseio.com/";
// ------------------------------------

const OFFLINE_AFTER_S = 90;

const METRICS = [
  { key: "luz",         label: "Luz",         unit: "lux", color: "#D9960B", dec: 0 },
  { key: "sonido",      label: "Sonido",      unit: "dB",  color: "#6F86E8", dec: 1 },
  { key: "temperatura", label: "Temperatura", unit: "°C",  color: "#E0583F", dec: 1 },
  { key: "humedad",     label: "Humedad",     unit: "%",   color: "#28A3B3", dec: 0 },
];

const grid = document.getElementById("grid");
METRICS.forEach(m => {
  const el = document.createElement("article");
  el.className = "panel";
  el.innerHTML = `
    <h2>${m.label}</h2>
    <div class="value" id="v-${m.key}">--<small>${m.unit}</small></div>
    <p class="minmax" id="mm-${m.key}"></p>
    <div class="chart"><canvas id="c-${m.key}" aria-label="Gráfica de ${m.label}" role="img"></canvas></div>`;
  grid.appendChild(el);
});

const fmt = (v, d) => Number(v).toLocaleString("es-CO", { minimumFractionDigits: d, maximumFractionDigits: d });
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- Gráficas ----------
const charts = {};
METRICS.forEach(m => {
  charts[m.key] = new Chart(document.getElementById("c-" + m.key), {
    type: "line",
    data: { labels: [], datasets: [{
      data: [], borderColor: m.color, backgroundColor: m.color + "26",
      borderWidth: 2, tension: .3, pointRadius: 0, pointHoverRadius: 4, fill: true
    }]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => `${fmt(c.parsed.y, m.dec)} ${m.unit}` } } },
      scales: {
        x: { grid: { display: false }, ticks: { maxTicksLimit: 5, maxRotation: 0 } },
        y: { grace: "10%", ticks: { maxTicksLimit: 4 } }
      }
    }
  });
});

function themeCharts() {
  Object.values(charts).forEach(c => {
    c.options.scales.x.ticks.color = css("--muted");
    c.options.scales.y.ticks.color = css("--muted");
    c.options.scales.y.grid.color = css("--grid");
    c.update();
  });
}
themeCharts();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeCharts);

// ---------- Firebase ----------
const app = initializeApp({ databaseURL: DATABASE_URL });
const db = getDatabase(app);

let lastTs = null;
const statusEl = document.getElementById("status");
const statusText = document.getElementById("statusText");
const emptyEl = document.getElementById("empty");

function ago(s) {
  if (s < 60) return `${Math.max(0, Math.round(s))} s`;
  if (s < 3600) return `${Math.round(s / 60)} min`;
  return `${Math.round(s / 3600)} h`;
}

function renderStatus() {
  if (lastTs === null) return;
  const s = Date.now() / 1000 - lastTs;
  const online = s <= OFFLINE_AFTER_S;
  statusEl.className = "status " + (online ? "on" : "off");
  statusText.textContent = online ? `En línea, dato de hace ${ago(s)}` : `Sin señal, último dato hace ${ago(s)}`;
}
setInterval(renderStatus, 5000);

onValue(ref(db, "medio_ambiente/actual"), snap => {
  const d = snap.val();
  if (!d) {
    statusText.textContent = "Sin datos";
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";
  lastTs = d.ts;
  METRICS.forEach(m => {
    if (d[m.key] === undefined) return;
    document.getElementById("v-" + m.key).innerHTML = `${fmt(d[m.key], m.dec)}<small>${m.unit}</small>`;
  });
  renderStatus();
}, err => {
  statusEl.className = "status off";
  statusText.textContent = "No se pudo leer Firebase: revisa las reglas y la URL";
  console.error(err);
});

let unsubHist = null;
function cargarHistorial(n) {
  if (unsubHist) unsubHist();
  unsubHist = onValue(query(ref(db, "medio_ambiente/historial"), limitToLast(n)), snap => {
    const rows = Object.values(snap.val() || {}).filter(r => r.ts).sort((a, b) => a.ts - b.ts);
    const labels = rows.map(r => new Date(r.ts * 1000).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }));
    METRICS.forEach(m => {
      const vals = rows.map(r => r[m.key]).filter(v => typeof v === "number");
      const c = charts[m.key];
      c.data.labels = labels;
      c.data.datasets[0].data = rows.map(r => r[m.key]);
      c.update();
      document.getElementById("mm-" + m.key).textContent = vals.length
        ? `Mín ${fmt(Math.min(...vals), m.dec)}   Máx ${fmt(Math.max(...vals), m.dec)}`
        : "";
    });
  });
}
cargarHistorial(60);

document.querySelectorAll(".range button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".range button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    cargarHistorial(Number(b.dataset.n));
  });
});
</script>
</body>
</html>
